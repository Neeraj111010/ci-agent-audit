id: auggie
name: Augment Auggie CLI
vendor: Augment
description: Auggie CLI and official GitHub Actions for running Augment's agentic coding assistant in CI workflows.
action_prefixes:
  - augmentcode/augment-action
  - augmentcode/augment-agent
cli_binaries:
  - auggie
cli_packages:
  - "@augmentcode/auggie"
prompt_inputs:
  - prompt
  - instruction
  - instruction_file
  - custom_context
cli_prompt_flags:
  - --print
dangerous_inputs: {}
dangerous_arg_patterns: []
