id: amp
name: Amp CLI
vendor: Amp
description: Amp coding agent CLI and the first-party Amp Code Review GitHub Actions container.
action_prefixes:
  - "docker://ghcr.io/sourcegraph/cra-github:latest"
cli_binaries:
  - amp
cli_packages:
  - "@ampcode/cli"
  - "@sourcegraph/amp"
cli_prompt_flags:
  - -x
  - --execute
  - -ox
dangerous_inputs: {}
dangerous_arg_patterns: []
